<title>Steam 游戏库 · 780 + 277</title>
<style>
  :root{
    --bg:#fbfbfc; --fg:#16181d; --muted:#8b909a; --line:#e8eaee;
    --panel:#fff; --accent:#2563eb; --hover:#f4f6fa; --ok:#1e7b34;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Open Sans","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(251,251,252,.9);
    backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line);
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}
  .bar{display:flex;align-items:center;gap:14px;height:58px}
  .logo{font-weight:650;font-size:15px;letter-spacing:.2px;white-space:nowrap}
  .tabs{display:flex;gap:6px;margin-left:auto}
  .tab{
    display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:8px;
    border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;
    font:inherit;font-size:13.5px;white-space:nowrap;
  }
  .tab:hover{background:var(--hover);color:var(--fg)}
  .tab.active{background:#eef2fb;border-color:#d7e0f5;color:#1c3fae;font-weight:600}
  .tab b{font-weight:600;font-variant-numeric:tabular-nums}
  .panel{display:none;padding:0 0 12px}
  .panel.active{display:block}
  .rowctl{display:flex;align-items:center;gap:10px}
  .search{position:relative;flex:1;min-width:0}
  .search input{
    width:100%;height:36px;padding:0 34px 0 34px;border:1px solid var(--line);border-radius:8px;
    background:var(--panel);color:var(--fg);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .search input:focus{border-color:#c9d4ea;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
  .search svg{position:absolute;left:11px;top:10px;color:var(--muted)}
  .clear{position:absolute;right:8px;top:8px;width:20px;height:20px;border:0;border-radius:50%;
    background:#e9ecf1;color:#666;cursor:pointer;display:none;font-size:13px;line-height:20px;text-align:center;padding:0}
  select{
    height:32px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
    color:var(--fg);font-size:13px;outline:none;cursor:pointer
  }
  .count{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:112px;text-align:right}
  main{max-width:960px;margin:0 auto;padding:8px 20px 80px}
  ul.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  li.row{
    display:flex;align-items:center;gap:14px;padding:9px 6px;border-bottom:1px solid var(--line);
    border-radius:6px;transition:background .12s
  }
  li.row:hover{background:var(--hover)}
  li.row[hidden]{display:none}
  .thumb{
    width:72px;height:34px;flex:0 0 72px;border-radius:4px;overflow:hidden;background:#eceef3;position:relative
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
  .meta{display:flex;align-items:center;gap:12px;flex:0 0 auto;font-size:12px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .meta .m{display:inline-flex;align-items:center;gap:5px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
  .appid{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:62px;text-align:right}
  .appid a{color:inherit;text-decoration:none}
  .appid a:hover{color:var(--accent);text-decoration:underline}
  .empty{padding:80px 0;text-align:center;color:var(--muted);font-size:14px}
  footer{color:#a7abb4;font-size:12px;text-align:center;padding:0 20px 40px}
  @media (max-width:640px){
    .logo{display:none}
    .tabs{margin-left:0;width:100%;justify-content:space-between}
    .thumb{width:56px;height:26px;flex-basis:56px}
    .name{font-size:14px}
    .meta{display:none}
  }
</style>
</head>

      else if (mode === 'id-asc') arr.sort(function (x, y) { return (x.a || 0) - (y.a || 0); });
      else if (mode === 'id-desc') arr.sort(function (x, y) { return (y.a || 0) - (x.a || 0); });
      else if (mode === 'pt-desc') arr.sort(function (x, y) { return (y.pt || 0) - (x.pt || 0); });
      else if (mode === 'installed') arr.sort(function (x, y) { return (y.in || 0) - (x.in || 0); });
      pool[mode] = arr;
      return arr;
    }

    function render() {
      var order = sortedBy(sortEl.value || 'default');
      var frag = document.createDocumentFragment();
      for (var k = 0; k < order.length; k++) frag.appendChild(indexOf.get(String(order[k].i)));
      listEl.appendChild(frag);
      applyFilter();
    }

    function applyFilter() {
      var raw = qEl.value.trim();
      var terms = raw.toLowerCase().split(/\s+/).filter(Boolean);
      var shown = 0;
      for (var k = 0; k < nodes.length; k++) {
        var el = nodes[k], ok = true;
        for (var t = 0; t < terms.length; t++) {
          if (el.dataset.n.indexOf(terms[t]) === -1 && el.dataset.a.indexOf(terms[t]) === -1) { ok = false; break; }
        }
        el.hidden = !ok;
        if (ok) shown++;
      }
      emptyEl.hidden = shown !== 0;
      clearEl.style.display = raw ? 'block' : 'none';
      countEl.textContent = shown === GAMES.length
        ? '共 ' + GAMES.length + ' 个'
        : '匹配 ' + shown + ' / ' + GAMES.length;
    }

    qEl.addEventListener('input', applyFilter);
    qEl.addEventListener('keydown', function (e) { if (e.key === 'Escape') { qEl.value = ''; applyFilter(); } });
    clearEl.addEventListener('click', function () { qEl.value = ''; qEl.focus(); applyFilter(); });
    sortEl.addEventListener('change', render);

    render();
    return { applyFilter: applyFilter, render: render };
  }

  var groups = {
    all: makeGroup({ dataId: 'data-all', listId: 'list-all', emptyId: 'empty-all',
                     qId: 'q-all', clearId: 'clear-all', sortId: 'sort-all', countId: 'count-all' }),
    client: makeGroup({ dataId: 'data-client', listId: 'list-client', emptyId: 'empty-client',
                        qId: 'q-client', clearId: 'clear-client', sortId: 'sort-client',
                        countId: 'count-client', meta: true })
  };

  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var panels = Array.prototype.slice.call(document.querySelectorAll('.panel'));
  var sections = { all: document.getElementById('group-all'), client: document.getElementById('group-client') };

  function activate(name) {
    tabs.forEach(function (t) { t.classList.toggle('active', t.dataset.tab === name); });
    panels.forEach(function (p) { p.classList.toggle('active', p.dataset.panel === name); });
    Object.keys(sections).forEach(function (k) { sections[k].hidden = (k !== name); });
    var q = document.getElementById(name === 'all' ? 'q-all' : 'q-client');
    if (q) q.focus();
    try { history.replaceState(null, '', '#' + name); } catch (e) {}
    groups[name].applyFilter();
  }

  tabs.forEach(function (t) { t.addEventListener('click', function () { activate(t.dataset.tab); }); });

  var start = (location.hash || '').replace('#', '');
  activate(start === 'client' ? 'client' : 'all');
})();
</script>
</body>
</html>
