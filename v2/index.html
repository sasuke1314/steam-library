<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3f8">
<title>Steam 清单目录</title>
<style>
  :root{
    --bg:#eef3f8; --card:#fff; --fg:#16202c; --muted:#89a0b5; --line:#e6eef6;
    --blue:#1a73e8; --blue-soft:#e8f1fd; --shadow:0 2px 10px rgba(33,74,116,.05);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .shell{max-width:520px;margin:0 auto;padding:0 16px 40px}

  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(238,243,248,.92);backdrop-filter:blur(12px)}
  .bar{display:flex;align-items:center;gap:10px;height:58px}
  .ava{width:34px;height:34px;border-radius:50%;flex:0 0 34px;
       background:url('avatar.jpg') center/cover no-repeat;
       box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .ttl{font-size:15px;font-weight:600;letter-spacing:.2px}
  .bar .sp{flex:1}
  .icon{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:#7d94a9;
        display:flex;align-items:center;justify-content:center;cursor:pointer}
  .icon:hover{background:#e4ecf5}

  /* hero */
  .hero{text-align:center;padding:18px 0 22px}
  .hero .big{width:74px;height:74px;border-radius:50%;margin:0 auto 14px;
       background:url('avatar.jpg') center/cover no-repeat;
       box-shadow:0 4px 14px rgba(33,74,116,.18), inset 0 0 0 1px rgba(0,0,0,.06)}
  .hero h1{margin:0;font-size:25px;line-height:1.35;font-weight:600;letter-spacing:.3px}
  .hero h1 em{font-style:normal;color:var(--blue)}
  .hero p{margin:10px 0 0;color:#5f7688;font-size:13.5px}

  /* segmented */
  .seg{display:flex;background:#e3ebf4;border-radius:14px;padding:4px;margin:0 0 16px}
  .seg button{flex:1;height:38px;border:0;border-radius:11px;background:transparent;color:#5f7688;
    font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:.18s}
  .seg button.on{background:#fff;color:var(--fg);font-weight:600;box-shadow:0 1px 4px rgba(33,74,116,.1)}

  /* search box */
  .sbox{position:relative;margin:0 0 18px}
  .sbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9fb2c4}
  .sbox input{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:#fff;
    padding:0 14px 0 42px;font:inherit;font-size:14px;outline:none;box-shadow:var(--shadow)}
  .sbox input:focus{border-color:#bcd6f5}

  /* cards / lists */
  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
  ul{list-style:none;margin:0;padding:0}
  .hitcount{font-size:12px;color:var(--muted);margin:-8px 0 8px 4px}
  li.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:default}
  li.row:last-child{border-bottom:0}
  li.row.tap{cursor:pointer}
  li.row.tap:hover{background:#f7fafd}
  .th{width:52px;height:24px;flex:0 0 52px;border-radius:4px;overflow:hidden;background:#eef2f6}
  .th img{width:100%;height:100%;object-fit:cover;display:block}
  .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
  .badges{display:flex;gap:6px;flex:0 0 auto}
  .bdg{font-size:11px;line-height:18px;padding:0 8px;border-radius:9px;background:var(--blue-soft);color:#1b62c9;
       font-variant-numeric:tabular-nums;white-space:nowrap}
  .bdg.b2{background:#fdeee6;color:#b4562a}
  .meta{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}

  /* empty state */
  .empty{text-align:center;padding:44px 10px 30px;color:#7d94a9}
  .empty svg{color:#b9c9d8;margin-bottom:10px}
  .empty h3{margin:0;font-size:17px;color:var(--fg);font-weight:600}
  .empty p{margin:8px 0 0;font-size:13px}

  /* account cards */
  .acc{cursor:pointer;display:flex;align-items:center;gap:14px;padding:18px 16px;margin-bottom:12px;
       background:#fff;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow)}
  .acc:hover{transform:translateY(-1px)}
  .acc .dot{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
       font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,#5aa2f0,#2f6fc4);flex:0 0 38px}
  .acc .dot.b2{background:linear-gradient(135deg,#f0a15a,#c46a2f)}
  .acc .t{flex:1;min-width:0}
  .acc .t b{display:block;font-size:15px;font-weight:600}
  .acc .t span{font-size:12.5px;color:var(--muted)}
  .acc .arrow{color:#c2d2e0}

  /* detail */
  .back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:#5f7688;
        font:inherit;font-size:13.5px;padding:4px 0;cursor:pointer;margin-bottom:6px}
  .back:hover{color:var(--blue)}

  /* notice */
  .notice{margin-top:22px;background:#fff;border-radius:var(--radius);border:1px solid var(--line);
          box-shadow:var(--shadow);padding:16px 16px 6px}
  .nh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .nh b{font-size:15px;font-weight:600}
  .nh .nb{min-width:22px;height:22px;border-radius:11px;background:var(--blue);color:#fff;font-size:12px;
          display:flex;align-items:center;justify-content:center;padding:0 7px}
  .notice ul{padding-bottom:10px}
  .notice li{position:relative;padding:0 0 10px 15px;font-size:12.5px;color:#4d6478;line-height:1.65}
  .notice li::before{content:"";position:absolute;left:2px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
  footer{text-align:center;color:#a9bccd;font-size:11.5px;padding:26px 0 0}
  /* dark */
  html.dark{--bg:#0f1720;--card:#16212c;--fg:#e6eef6;--muted:#8ba2b6;--line:#22303d;
            --blue-soft:#17304d;--shadow:0 2px 10px rgba(0,0,0,.35);--blue:#4d9bf5}
  html.dark body{background:var(--bg)}
  html.dark header{background:rgba(15,23,32,.92)}
  html.dark .seg{background:#1a2734}
  html.dark .seg button.on{background:#16212c;color:var(--fg)}
  html.dark .sbox input{background:var(--card);color:var(--fg)}
  html.dark .bdg{background:#17304d;color:#8fc0ff}
  html.dark .bdg.b2{background:#3a2418;color:#e6ad84}
  html.dark .acc{background:var(--card)}
  html.dark .notice li{color:#b6c7d6}
  html.dark .hero p{color:#93a9bc}
  html.dark .card,html.dark .notice{background:var(--card)}  [hidden]{display:none !important}
</style>
</head>
<body>
<header>
  <div class="shell">
    <div class="bar">
      <div class="ava" aria-hidden="true"></div>
      <div class="ttl">Steam 账号清单 · 目录检索</div>
      <div class="sp"></div>
      <button class="icon" id="btnTheme" title="切换主题" aria-label="切换主题">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
      <button class="icon" id="btnBell" title="提示" aria-label="提示">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="shell">
  <section class="hero">
    <div class="big" aria-hidden="true"></div>
    <h1>你的<br><em>Steam</em> 清单目录</h1>
    <p>浏览两个账号的游戏清单，快速找到想玩的。秋天出品，2026.</p>
  </section>

  <div class="seg">
    <button data-mode="search" class="on">搜游戏</button>
    <button data-mode="account">按账号浏览</button>
  </div>

  <section id="pane-search">
    <div class="sbox">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="q" type="search" placeholder="输入游戏名称搜索..." autocomplete="off" spellcheck="false">
    </div>
    <div class="empty" id="emptySearch">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 015.5 6h13A2.5 2.5 0 0121 8.5v9A2.5 2.5 0 0118.5 20h-13A2.5 2.5 0 013 17.5v-9z"/><path d="M3 12h5l1.5 2.5h5L16 12h5"/></svg>
      <h3>搜索游戏</h3>
      <p id="emptyHint">正在加载…</p>
    </div>
    <div id="hitCount" class="hitcount" hidden></div>
    <ul id="results" class="card" hidden></ul>
  </section>

  <section id="pane-account" hidden>
    <div id="accList"></div>
    <div id="accDetail" hidden>
      <button class="back" id="btnBack">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        返回账号列表
      </button>
      <div class="sbox">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="q2" type="search" placeholder="在该账号内搜索..." autocomplete="off" spellcheck="false">
      </div>
      <ul id="accGames" class="card"></ul>
    </div>
  </section>

  <section class="notice">
    <div class="nh"><b>重要提示</b><span class="nb" id="nb">3</span></div>
    <ul>
      <li>本清单把两个游戏账号合在一起检索：搜到游戏后，右侧标签会标注它属于哪个账号（<b>780</b> / <b>230+</b>）。</li>
      <li>同一个游戏两个账号都有时，会同时显示两个标签。</li>
      <li>数据由管理员在后台维护，页面每 20 秒自动同步，无需刷新。</li>
    </ul>
  </section>

  <footer id="stamp">—</footer>
</div>

<script>
(function () {
  var BUILD = '20261124-224947';
  var $ = function (id) { return document.getElementById(id); };
  var collator = new Intl.Collator('zh-Hans-CN', { numeric: true, sensitivity: 'base' });
  var ACCOUNTS = [
    { key: 'g780', label: '780', cls: '', desc: '主账号' },
    { key: 'g230', label: '230+', cls: 'b2', desc: '副账号' }
  ];

  var state = { data: null, rev: null, mode: 'search', acc: null, q: '', q2: '' };

  function normalize(s) { return String(s || '').toLowerCase(); }

  function fmtRev(rev) {
    if (!rev || rev.length < 14) return '—';
    return '数据更新于 ' + rev.slice(0, 4) + '-' + rev.slice(4, 6) + '-' + rev.slice(6, 8) +
      ' ' + rev.slice(8, 10) + ':' + rev.slice(10, 12);
  }

  // combined index: appid/name -> entry with accounts
  var index = [];
  function buildIndex() {
    var map = new Map();
    ACCOUNTS.forEach(function (acc) {
      var arr = state.data[acc.key] || [];
      arr.forEach(function (g) {
        var k = g.a ? ('a' + g.a) : ('n' + normalize(g.n));
        var e = map.get(k);
        if (!e) {
          e = { n: g.n, a: g.a || 0, f: g.f || '', accs: [], in: false, pt: null };
          map.set(k, e);
          index.push(e);
        }
        if (e.accs.indexOf(acc.label) === -1) e.accs.push(acc.label);
        if (g.in) e.in = true;
        if (g.pt !== undefined && (e.pt === null || g.pt > e.pt)) e.pt = g.pt;
      });
    });
    index.sort(function (x, y) { return collator.compare(x.n, y.n); });
  }

  function badge(label) {
    var s = document.createElement('span');
    s.className = 'bdg' + (label === '230+' ? ' b2' : '');
    s.textContent = label;
    return s;
  }

  function row(g, opts) {
    opts = opts || {};
    var li = document.createElement('li');
    li.className = 'row' + (opts.tap ? ' tap' : '');

    var th = document.createElement('div'); th.className = 'th';
    if (g.a) {
      var img = document.createElement('img');
      img.loading = 'lazy'; img.alt = '';
      img.src = 'https://cdn.cloudflare.steamstatic.com/steam/apps/' + g.a + '/header.jpg';
      img.onerror = function () { this.style.display = 'none'; };
      th.appendChild(img);
    }
    var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = g.n;
    li.appendChild(th); li.appendChild(nm);

    if (opts.accounts && g.accs && g.accs.length) {
      var bs = document.createElement('div'); bs.className = 'badges';
      g.accs.forEach(function (a) { bs.appendChild(badge(a)); });
      li.appendChild(bs);
    }
    if (opts.meta) {
      var m = document.createElement('div'); m.className = 'meta';
      var bits = [];
      if (g.in) bits.push('已安装');
      if (g.pt) bits.push(g.pt + 'h');
      if (bits.length) { m.textContent = bits.join(' · '); li.appendChild(m); }
    }
    return li;
  }

  function renderSearch() {
    var q = normalize(state.q).trim();
    var ul = $('results');
    var empty = $('emptySearch');

    if (!q) {
      ul.hidden = true; empty.hidden = false;
      $('hitCount').hidden = true;
      var total = index.length;
      $('emptyHint').textContent = '共 ' + total + ' 款游戏 · ' + ACCOUNTS.length + ' 个账号，输入名称查找';
      return;
    }

    var hits = [];
    for (var i = 0; i < index.length && hits.length < 120; i++) {
      var e = index[i];
      if (normalize(e.n).indexOf(q) !== -1 || normalize(e.f).indexOf(q) !== -1 || String(e.a).indexOf(q) !== -1) hits.push(e);
    }
    if (!hits.length) {
      ul.hidden = true; empty.hidden = false;
      $('hitCount').hidden = true;
      $('emptyHint').textContent = '没有匹配「' + state.q.trim() + '」的游戏';
      return;
    }
    empty.hidden = true; ul.hidden = false;
    var hc = $('hitCount'); hc.hidden = false; hc.textContent = '找到 ' + hits.length + ' 个结果';
    ul.innerHTML = '';
    hits.forEach(function (g) { ul.appendChild(row(g, { accounts: true })); });
  }

  function renderAccounts() {
    var wrap = $('accList');
    wrap.innerHTML = '';
    ACCOUNTS.forEach(function (acc) {
      var n = (state.data[acc.key] || []).length;
      var d = document.createElement('div');
      d.className = 'acc';
      d.innerHTML = '<div class="dot ' + acc.cls + '">' + acc.label.replace('+', '') + '</div>' +
        '<div class="t"><b>账号 ' + acc.label + '</b><span>' + n + ' 款游戏 · ' + acc.desc + '</span></div>' +
        '<div class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>';
      d.onclick = function () { state.acc = acc; state.q2 = ''; $('q2').value = ''; renderAccountDetail(); };
      wrap.appendChild(d);
    });
  }

  function renderAccountDetail() {
    var acc = state.acc;
    if (!acc) { $('accDetail').hidden = true; $('accList').hidden = false; return; }
    $('accList').hidden = true;
    $('accDetail').hidden = false;

    var q = normalize(state.q2).trim();
    var arr = (state.data[acc.key] || []).slice().sort(function (x, y) { return (x.i || 0) - (y.i || 0); });
    var ul = $('accGames');
    ul.innerHTML = '';
    var shown = 0;
    for (var i = 0; i < arr.length; i++) {
      var g = arr[i];
      if (q && (normalize(g.n) + ' ' + normalize(g.f) + ' ' + g.a).indexOf(q) === -1) continue;
      shown++;
      ul.appendChild(row(g, { meta: true }));
    }
    if (!shown) {
      var li = document.createElement('li');
      li.className = 'row';
      li.style.color = '#89a0b5';
      li.textContent = '没有匹配的游戏';
      ul.appendChild(li);
    }
  }

  function setMode(mode) {
    state.mode = mode;
    [].forEach.call(document.querySelectorAll('.seg button'), function (b) {
      b.classList.toggle('on', b.dataset.mode === mode);
    });
    $('pane-search').hidden = mode !== 'search';
    $('pane-account').hidden = mode !== 'account';
    if (mode === 'search') $('q').focus();
    try { history.replaceState(null, '', '#' + mode); } catch (e) {}
  }

  function renderAll() {
    buildIndex();
    renderSearch();
    renderAccounts();
    renderAccountDetail();
    $('stamp').textContent = fmtRev(state.rev);
    $('nb').textContent = '3';
  }

  function load(first) {
    return fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        if (!state.data || d.rev !== state.rev) {
          state.data = d; state.rev = d.rev;
          renderAll();
        }
      })
      .catch(function (e) {
        if (first) $('emptyHint').textContent = '数据加载失败：' + e.message;
      });
  }

  // wiring
  $('q').addEventListener('input', function () { state.q = this.value; renderSearch(); });
  $('q2').addEventListener('input', function () { state.q2 = this.value; renderAccountDetail(); });
  $('btnBack').addEventListener('click', function () { state.acc = null; renderAccountDetail(); });
  [].forEach.call(document.querySelectorAll('.seg button'), function (b) {
    b.addEventListener('click', function () { setMode(b.dataset.mode); });
  });
  var THEME_KEY = 'steamlib.theme';
  function applyTheme(dark) {
    document.documentElement.classList.toggle('dark', dark);
    try { localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); } catch (e) {}
  }
  try { if (localStorage.getItem(THEME_KEY) === 'dark') applyTheme(true); } catch (e) {}
  $('btnTheme').addEventListener('click', function () {
    applyTheme(!document.documentElement.classList.contains('dark'));
  });
  $('btnBell').addEventListener('click', function () {
    var n = document.querySelector('.notice'); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  var h = (location.hash || '').replace('#', '');
  setMode(h === 'account' ? 'account' : 'search');

  load(true);
  setInterval(function () { if (!document.hidden) load(false); }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(false); });
  // 自更新检测：部署了新页面后自动刷新一次（绕过 GitHub Pages 的 10 分钟 HTML 缓存）
  (function () {
    if (sessionStorage.getItem('build') === BUILD) return;
    setTimeout(function () {
      fetch('index.html?probe=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.text(); })
        .then(function (text) {
          var m = /var BUILD = '([^']+)'/.exec(text);
          if (m && m[1] !== BUILD) {
            sessionStorage.setItem('build', m[1]);
            location.replace(location.pathname + '?u=' + Date.now() + (location.hash || ''));
          }
        }).catch(function () {});
    }, 1200);
  })();
})();
</script>
</body>
</html>
